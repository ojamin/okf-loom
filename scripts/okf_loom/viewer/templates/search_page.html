<!DOCTYPE html>
<!--
  OKF search results page template.

  Placeholders (str.replace):
      __LANG__           → document language
      __THEME_ATTR__     → ` data-theme="light|dark|pastel|sepia|midnight"` (or empty)
      __HEAD_TITLE__     → <title> text
      __BUNDLE_NAME__    → display name
  __STATIC_PREFIX__  → URL prefix for /__static/ assets
  __DATA_ATTRS__     → extra data-* attributes for the SPA/static JS hook
                       (P1-10: lets wiki.js detect static mode on the search
                       page so the static-search-note shows correctly)
  __WIKI_CSS_LINK__  → <link rel="stylesheet" href="...wiki.css">
  __WIKI_JS_LINK__   → <script src="...wiki.js" defer></script>
  __RENDERERS_JS_LINK__ → <script src="...renderers.js" defer></script>
                       (progressive renderers + markdown UX enhancers
                       for tables/code/images in rendered prose)
      __QUERY_ESCAPED__  → url-encoded query for the input value
      __QUERY_HTML__     → html-escaped query for display
      __RESULTS_HTML__   → rendered results list
      __RESULT_COUNT__   → integer count (or "0")
      __BACK_LINK__      → URL back to the index
      __SEARCH_DATA_INLINE__ → inert template-held JSON corpus for file:// builds
-->
<html lang="__LANG__"__THEME_ATTR__>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>__HEAD_TITLE__</title>
__WIKI_CSS_LINK__
</head>
<body class="okf-viewer okf-viewer--search" __DATA_ATTRS__>
<a href="#okf-main" class="okf-skip-link">Skip to content</a>
<header class="okf-topbar">
  <div class="okf-topbar__brand">
    <a href="__BACK_LINK__" class="okf-brand-link"><strong>__BUNDLE_NAME__</strong></a>
    <span class="okf-muted">search</span>
  </div>
  __NAV_HTML__
</header>

<!-- iter1 CRI-019: SSR / no-JS fallback banner (see concept_page.html). -->
<noscript><p class="okf-studio-fallback-banner" role="alert">JavaScript is off. The live studio needs it, so this is a read-only view.</p></noscript>
<p class="okf-studio-fallback-banner" role="status">Live studio unavailable. Showing a read-only view.</p>

<main id="okf-main" class="okf-search">
  <!-- P2-3 (iter-2): the page's only h1 renders full-size full-colour.
       The prior <span class="okf-muted"> wrapper demoted it to 14px gray
       (.okf-muted sets font-size: --okf-text-sm), making the search page's
       primary heading the visually-weakest h1 across the three text
       surfaces. The curly quotes around the query already provide the
       visual distinction; no sub-span needed. -->
  <h1 class="okf-search__title">__RESULTS_HEADING__</h1>
  <div class="okf-search__results">
    __RESULTS_HTML__
  </div>
</main>

__SEARCH_DATA_INLINE__
__WIKI_JS_LINK__
__RENDERERS_JS_LINK__
</body>
</html>
