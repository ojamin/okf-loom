<!DOCTYPE html>
<!--
  OKF directory index / root index page template.

  Placeholders (str.replace):
      __LANG__           → document language
      __THEME_ATTR__     → ` data-theme="light|dark|pastel|sepia|midnight"` (or empty)
      __HEAD_TITLE__     → <title> text
      __BUNDLE_NAME__    → display name
  __STATIC_PREFIX__  → URL prefix for /__static/ assets
  __DATA_ATTRS__     → extra data-* attributes for the SPA/static JS hook
  __WIKI_CSS_LINK__  → <link rel="stylesheet" href="...wiki.css">
  __WIKI_JS_LINK__   → <script src="...wiki.js" defer></script>
  __RENDERERS_JS_LINK__ → <script src="...renderers.js" defer></script>
      __INDEX_TITLE__    → page <h1>
      __INDEX_INTRO__    → short lede HTML
      __HERO_STATS__     → CTA + stats chips
      __ORIENT_HTML__    → Start here / Recent / Themes / Map rails
      __ABOUT_HTML__     → optional About this bundle disclosure
      __GROUPS_HTML__    → Browse-all card grids (or subdir lists)
      __SUBDIRS_HTML__   → subdirectory index links
      __GLOBAL_GRAPH_LINK__ → URL to the global graph page
-->
<html lang="__LANG__"__THEME_ATTR__>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>__HEAD_TITLE__</title>
__WIKI_CSS_LINK__
</head>
<body class="okf-viewer okf-viewer--index" __DATA_ATTRS__>
<a href="#okf-main" class="okf-skip-link">Skip to content</a>
<header class="okf-topbar">
  <div class="okf-topbar__brand">
    <a href="__BRAND_HREF__" class="okf-brand-link"__BRAND_ARIA_CURRENT__><strong>__BUNDLE_NAME__</strong></a>
    <span class="okf-muted">okf-loom wiki</span>
  </div>
  __NAV_HTML__
</header>

<!-- iter1 CRI-019: SSR / no-JS fallback banner (see concept_page.html). -->
<noscript><p class="okf-studio-fallback-banner" role="alert">JavaScript is off. The live studio needs it, so this is a read-only view.</p></noscript>
<p class="okf-studio-fallback-banner" role="status">Live studio unavailable. Showing a read-only view.</p>

<main id="okf-main" class="okf-index">
  <header class="okf-hero okf-hero--atlas">
    <h1 class="okf-index__title">__INDEX_TITLE__</h1>
    <div class="okf-index__intro okf-prose okf-hero__lede-wrap">__INDEX_INTRO__</div>
    __HERO_STATS__
  </header>

  __ORIENT_HTML__
  __ABOUT_HTML__
  __SUBDIRS_HTML__
  __GROUPS_HTML__
</main>

__WIKI_JS_LINK__
__RENDERERS_JS_LINK__
</body>
</html>
